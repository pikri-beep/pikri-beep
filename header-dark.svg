<svg width="850" height="180" viewBox="0 0 850 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes islandPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.6; }
      }
      @keyframes msg1 {
        0%, 28% { opacity: 1; transform: translateY(0); }
        33%, 95% { opacity: 0; transform: translateY(-4px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes msg2 {
        0%, 31% { opacity: 0; transform: translateY(4px); }
        36%, 61% { opacity: 1; transform: translateY(0); }
        66%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes msg3 {
        0%, 64% { opacity: 0; transform: translateY(4px); }
        69%, 94% { opacity: 1; transform: translateY(0); }
        99%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes pillBorderGlow {
        0%, 100% { stroke: #30363D; }
        50% { stroke: #58A6FF; }
      }
      .island-dot {
        transform-origin: 345px 33px;
        animation: islandPulse 2s ease-in-out infinite;
      }
      .island-pill {
        animation: pillBorderGlow 4.5s ease-in-out infinite;
      }
      .msg-1 { animation: msg1 9s ease-in-out infinite; }
      .msg-2 { animation: msg2 9s ease-in-out infinite; }
      .msg-3 { animation: msg3 9s ease-in-out infinite; }
      
      @media (prefers-reduced-motion: reduce) {
        .island-dot, .island-pill, .msg-1, .msg-2, .msg-3 {
          animation: none !important;
        }
        .msg-1 { opacity: 1 !important; transform: none !important; }
        .msg-2, .msg-3 { display: none !important; }
      }
    </style>
  </defs>

  <!-- Background Base Container -->
  <rect x="0.5" y="0.5" width="849" height="179" rx="14" fill="#0D1117" stroke="#30363D"/>

  <!-- Left Header Tag -->
  <g transform="translate(32, 37)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#8B949E">&gt;_ SYSTEM: ONLINE</text>
  </g>

  <!-- Center: The Vision Pill (Dynamic Island) -->
  <g class="island-group">
    <!-- Pill Capsule Body -->
    <rect class="island-pill" x="325" y="18" width="230" height="30" rx="15" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    
    <!-- Pulsing Indicator Dot -->
    <circle class="island-dot" cx="345" cy="33" r="3.5" fill="#3FB950"/>

    <!-- Morphing Message 1 -->
    <g class="msg-1">
      <text x="360" y="37" font-family="'SF Mono', Consolas, Monaco, monospace" font-size="11.5" font-weight="600" fill="#F0F6FC">pemecut-ai // active</text>
    </g>

    <!-- Morphing Message 2 -->
    <g class="msg-2">
      <text x="360" y="37" font-family="'SF Mono', Consolas, Monaco, monospace" font-size="11.5" font-weight="600" fill="#58A6FF">vision-pill // dynamic</text>
    </g>

    <!-- Morphing Message 3 -->
    <g class="msg-3">
      <text x="360" y="37" font-family="'SF Mono', Consolas, Monaco, monospace" font-size="11.5" font-weight="600" fill="#7EE787">4 projects // shipped</text>
    </g>
  </g>

  <!-- Right Header Tag -->
  <g transform="translate(818, 37)">
    <text text-anchor="end" font-family="'SF Mono', Consolas, Monaco, monospace" font-size="11" fill="#8B949E">AUTONOMOUS SPRINT</text>
  </g>

  <!-- Title -->
  <text x="32" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em" fill="#F0F6FC">@pikri-beep</text>

  <!-- Tagline -->
  <text x="32" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#8B949E">Memecut model AI jadi software nyata. Dari desktop utility sampai tactile interface.</text>

  <!-- Footer Info Line -->
  <g transform="translate(32, 154)">
    <text x="0" y="0" font-family="'SF Mono', Consolas, Monaco, monospace" font-size="11" font-weight="700" fill="#58A6FF">FLAGSHIPS</text>
    <text x="75" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#484F58">|</text>
    <text x="88" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8B949E">Vision-pill (Windows Dynamic Island)</text>
    <text x="330" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#484F58">·</text>
    <text x="342" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8B949E">PocketDesk Remote</text>
    <text x="475" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#484F58">·</text>
    <text x="487" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8B949E">SnapMoment</text>
  </g>
</svg>
